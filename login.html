<title>Sign in — Open Kitchen</title>
<meta name="description" content="Sign in to your Open Kitchen account to cook, collaborate, and share with your community.">

<style>
  :root {
    --bg:         #0C1A0F;
    --surface:    #122018;
    --raised:     #192B20;
    --border:     #243B2C;
    --border-hi:  #2E4F38;
    --accent:     #D4AC3E;
    --accent-dk:  #B8952C;
    --text:       #EDE8DD;
    --muted:      #6B8570;
    --dim:        #3A5040;
    --error:      #E05C4B;
    --focus:      rgba(212, 172, 62, 0.28);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    background-image: radial-gradient(ellipse 120% 80% at 50% 40%, #162519 0%, #0C1A0F 68%);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    color: var(--text);
    padding: 2rem 1.25rem;
  }

  main {
    width: 100%;
    max-width: 388px;
  }

  /* ── Brand ───────────────────────────────── */
  .brand {
    text-align: center;
    margin-bottom: 1.75rem;
  }

  .brand-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 44px;
    height: 44px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 0.875rem;
  }

  .brand-name {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 1.5rem;
    letter-spacing: -0.03em;
    line-height: 1;
    color: var(--text);
  }

  .brand-name span { color: var(--accent); }

  .brand-tag {
    margin-top: 0.3rem;
    font-size: 0.6875rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--dim);
  }

  /* ── Card ────────────────────────────────── */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 2rem;
  }

  .card-head {
    margin-bottom: 1.5rem;
  }

  .card-title {
    font-size: 1.125rem;
    font-weight: 600;
    letter-spacing: -0.02em;
    text-wrap: balance;
    margin-bottom: 0.25rem;
  }

  .card-sub {
    font-size: 0.8125rem;
    color: var(--muted);
    line-height: 1.55;
  }

  /* ── OAuth ───────────────────────────────── */
  .oauth-group {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    margin-bottom: 1.375rem;
  }

  .btn-oauth {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5625rem;
    width: 100%;
    padding: 0.625rem 1rem;
    background: var(--raised);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 0.875rem;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    text-decoration: none;
    transition: background 0.14s ease, border-color 0.14s ease;
  }

  .btn-oauth:hover {
    background: #1F3428;
    border-color: var(--border-hi);
  }

  .btn-oauth:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  /* ── Divider ─────────────────────────────── */
  .divider {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    margin-bottom: 1.375rem;
  }

  .divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .divider span {
    font-size: 0.6875rem;
    color: var(--dim);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    white-space: nowrap;
  }

  /* ── Fields ──────────────────────────────── */
  .fields {
    display: flex;
    flex-direction: column;
    gap: 1rem;
    margin-bottom: 1.25rem;
  }

  .field { display: flex; flex-direction: column; }

  .field-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 0.375rem;
  }

  label {
    font-size: 0.6875rem;
    font-weight: 600;
    color: var(--muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .link-subtle {
    font-size: 0.75rem;
    color: var(--muted);
    text-decoration: none;
    transition: color 0.14s;
  }

  .link-subtle:hover { color: var(--accent); }

  input[type="email"],
  input[type="password"] {
    width: 100%;
    padding: 0.625rem 0.875rem;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 0.9375rem;
    font-family: inherit;
    outline: none;
    transition: border-color 0.14s, box-shadow 0.14s;
  }

  input::placeholder { color: var(--dim); }

  input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--focus);
  }

  /* ── Submit ──────────────────────────────── */
  .btn-primary {
    display: block;
    width: 100%;
    padding: 0.6875rem;
    background: var(--accent);
    color: #0A1408;
    border: none;
    border-radius: 8px;
    font-size: 0.9375rem;
    font-weight: 700;
    font-family: inherit;
    letter-spacing: -0.01em;
    cursor: pointer;
    margin-bottom: 1.375rem;
    transition: background 0.14s;
  }

  .btn-primary:hover { background: var(--accent-dk); }
  .btn-primary:active { opacity: 0.9; }

  .btn-primary:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  /* ── Footer ──────────────────────────────── */
  .card-footer {
    text-align: center;
    font-size: 0.8125rem;
    color: var(--muted);
  }

  .card-footer a {
    color: var(--accent);
    text-decoration: none;
    font-weight: 500;
  }

  .card-footer a:hover { text-decoration: underline; }

  /* ── Error state ─────────────────────────── */
  .field.has-error input { border-color: var(--error); }
  .field-error {
    display: none;
    margin-top: 0.3rem;
    font-size: 0.75rem;
    color: var(--error);
  }
  .field.has-error .field-error { display: block; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: 0ms !important; }
  }
</style>

<main>
  <!-- Brand -->
  <div class="brand">
    <div class="brand-icon" aria-hidden="true">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#D4AC3E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 11l9-9 9 9"/>
        <path d="M9 21V11h6v10"/>
        <path d="M12 6v2"/>
      </svg>
    </div>
    <div class="brand-name">Open<span>Kitchen</span></div>
    <div class="brand-tag">Community · Recipes · Craft</div>
  </div>

  <!-- Card -->
  <div class="card" role="main">
    <div class="card-head">
      <h1 class="card-title">Welcome back</h1>
      <p class="card-sub">Sign in to your kitchen to continue.</p>
    </div>

    <!-- OAuth -->
    <div class="oauth-group">
      <button type="button" class="btn-oauth" aria-label="Continue with Google">
        <svg width="17" height="17" viewBox="0 0 18 18" aria-hidden="true">
          <path fill="#4285F4" d="M17.64 9.2a10 10 0 0 0-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92a8.78 8.78 0 0 0 2.68-6.62z"/>
          <path fill="#34A853" d="M9 18a8.6 8.6 0 0 0 5.96-2.18l-2.92-2.26A5.43 5.43 0 0 1 9 14.5a5.38 5.38 0 0 1-5.06-3.72H.96v2.33A9 9 0 0 0 9 18z"/>
          <path fill="#FBBC05" d="M3.94 10.78A5.54 5.54 0 0 1 3.65 9c0-.62.11-1.23.29-1.78V4.89H.96A9.01 9.01 0 0 0 0 9c0 1.45.35 2.82.96 4.11l2.98-2.33z"/>
          <path fill="#EA4335" d="M9 3.58a4.86 4.86 0 0 1 3.44 1.35l2.58-2.58A8.64 8.64 0 0 0 9 0 9 9 0 0 0 .96 4.89L3.94 7.22A5.38 5.38 0 0 1 9 3.58z"/>
        </svg>
        Continue with Google
      </button>
      <button type="button" class="btn-oauth" aria-label="Continue with GitHub">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="#EDE8DD" aria-hidden="true">
          <path d="M12 0C5.37 0 0 5.37 0 12c0 5.3 3.44 9.8 8.2 11.38.6.1.82-.26.82-.58 0-.28-.01-1.03-.02-2.03-3.34.73-4.04-1.61-4.04-1.61-.55-1.4-1.34-1.77-1.34-1.77-1.1-.75.08-.73.08-.73 1.2.08 1.84 1.24 1.84 1.24 1.07 1.83 2.8 1.3 3.49 1 .1-.78.42-1.3.76-1.6-2.66-.3-5.47-1.33-5.47-5.93 0-1.3.47-2.38 1.23-3.22-.12-.3-.53-1.52.12-3.18 0 0 1-.32 3.3 1.23a11.5 11.5 0 0 1 3-.4c1.02 0 2.04.13 3 .4 2.28-1.55 3.29-1.23 3.29-1.23.65 1.66.24 2.88.12 3.18.77.84 1.23 1.9 1.23 3.22 0 4.61-2.8 5.63-5.48 5.92.43.37.81 1.1.81 2.22 0 1.6-.01 2.9-.01 3.29 0 .32.21.7.82.58A12 12 0 0 0 24 12C24 5.37 18.63 0 12 0z"/>
        </svg>
        Continue with GitHub
      </button>
    </div>

    <div class="divider" aria-hidden="true"><span>or sign in with email</span></div>

    <!-- Form -->
    <form id="login-form" novalidate>
      <div class="fields">
        <div class="field" id="field-email">
          <div class="field-header">
            <label for="email">Email</label>
          </div>
          <input
            type="email"
            id="email"
            name="email"
            autocomplete="email"
            placeholder="you@example.com"
            required
          />
          <span class="field-error" role="alert">Enter a valid email address.</span>
        </div>

        <div class="field" id="field-password">
          <div class="field-header">
            <label for="password">Password</label>
            <a href="/forgot-password" class="link-subtle">Forgot password?</a>
          </div>
          <input
            type="password"
            id="password"
            name="password"
            autocomplete="current-password"
            placeholder="••••••••"
            required
            minlength="8"
          />
          <span class="field-error" role="alert">Password must be at least 8 characters.</span>
        </div>
      </div>

      <button type="submit" class="btn-primary">Sign in</button>
    </form>

    <p class="card-footer">
      No account? <a href="/register">Create one free</a>
    </p>
  </div>
</main>

<script>
  const form = document.getElementById('login-form');

  form.addEventListener('submit', e => {
    e.preventDefault();
    let valid = true;

    const email = document.getElementById('email');
    const emailField = document.getElementById('field-email');
    if (!email.validity.valid) {
      emailField.classList.add('has-error');
      valid = false;
    } else {
      emailField.classList.remove('has-error');
    }

    const password = document.getElementById('password');
    const passField = document.getElementById('field-password');
    if (!password.validity.valid) {
      passField.classList.add('has-error');
      valid = false;
    } else {
      passField.classList.remove('has-error');
    }

    if (valid) {
      form.querySelector('.btn-primary').textContent = 'Signing in…';
    }
  });

  ['email', 'password'].forEach(name => {
    const input = document.getElementById(name);
    const field = document.getElementById('field-' + name);
    input.addEventListener('input', () => {
      if (input.validity.valid) field.classList.remove('has-error');
    });
  });
</script>
